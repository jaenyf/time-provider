name: Release Please

on:
  push:
    branches:
      - main
      - "hotfix/**"
  workflow_dispatch:
    inputs:
      paths:
        description: >-
          JSON array of package paths to run post-release-updates/publish for, e.g.
          ["packages/core","packages/plugin-dayjs"]. Use this to rescue an already-tagged
          release whose automation failed partway (release-please won't re-flag a release
          it already created, so a plain push won't retrigger these jobs on its own).
        required: true
        type: string

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          target-branch: ${{ github.ref_name }}
          config-file: ${{ startsWith(github.ref_name, 'hotfix/') && 'release-please-config.hotfix.json' || 'release-please-config.json' }}
          manifest-file: .release-please-manifest.json
          include-component-in-tag: true
          token: ${{ secrets.GITHUB_TOKEN }}

  post-release-updates:
    needs: release
    if: needs.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "24"
          cache: true

      - run: vp install --frozen-lockfile
      - run: vp run build

      - name: Aggregate changelog
        run: node scripts/aggregate-changelog.ts

      - name: Run benchmark suite and update BENCHMARK.md
        working-directory: tools/benchmark
        run: vp run bench:changelog

      - name: Commit changelog and benchmark history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md BENCHMARK.md
          git diff --cached --quiet || git commit -m "chore: update changelog and benchmark history [skip ci]"
          git push

  resolve-publish-targets:
    needs: release
    if: needs.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      paths: ${{ steps.resolve.outputs.paths }}
    steps:
      - name: Resolve and validate package paths to publish
        id: resolve
        env:
          PATHS: ${{ github.event_name == 'workflow_dispatch' && inputs.paths || needs.release.outputs.paths_released }}
        run: |
          echo "Resolved paths: $PATHS"
          if ! COUNT=$(jq 'length' <<<"$PATHS" 2>&1); then
            echo "::error::paths input is not valid JSON: $PATHS"
            exit 1
          fi
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::release-please reported releases_created=true but paths_released came back empty - nothing to auto-publish. Re-run this workflow manually via workflow_dispatch, passing the paths of the packages that were released (see the release-please PR / new tags), e.g. [\"packages/core\"]."
            exit 1
          fi
          echo "paths=$PATHS" >> "$GITHUB_OUTPUT"

  publish:
    needs: [release, post-release-updates, resolve-publish-targets]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJson(needs.resolve-publish-targets.outputs.paths) }}

    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@time-provider"
          cache: false
          run-install: false

      - run: vp install --frozen-lockfile

      - name: Publish ${{ matrix.path }}
        env:
          PACKAGE_PATH: ${{ matrix.path }}
        run: npm run -w "$PACKAGE_PATH" release

  close-released-issues:
    needs: publish
    permissions:
      issues: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const label = "awaiting-release";

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: "open",
            });

            for (const issue of issues) {
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Released - see [CHANGELOG.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CHANGELOG.md). Closing.`,
                });
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name: label,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: "closed",
                });
              } catch (error) {
                core.warning(`Failed to close issue #${issue.number}: ${error.message}`);
              }
            }
