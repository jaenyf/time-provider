name: Label issues awaiting release

on:
  pull_request:
    types: [closed]
  push:
    branches: [main]

# queue: max ensures every merge to main gets processed (each is responsible for a distinct issue), none silently dropped if several land close together.
# This workflow needs "Auto-close issues with merged linked pull requests" is unchecked on github.
concurrency:
  group: issue-lifecycle
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  label-awaiting-release:
    if: >
      github.event_name == 'push' || (
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main' &&
        !startsWith(github.event.pull_request.head.ref, 'release-please--branches--')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const prNumber = context.payload.pull_request?.number;
            const label = "awaiting-release";

            // Create the label if it doesn't exist yet - ignore the error if it already does.
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: "fbca04",
                description: "Fix merged, not yet released",
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            const query = `
              query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 50, after: $cursor) {
                      nodes {
                        number
                        repository {
                          owner { login }
                          name
                        }
                      }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }
              }
            `;

            const { data: configFile } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: "release-please-config.json",
              ref: context.sha,
            });
            const packagePaths = Object.keys(JSON.parse(Buffer.from(configFile.content, "base64").toString()).packages);
            const packageNames = packagePaths.map((path) => path.split("/").pop());
            const packagesOf = (files) => packageNames.filter((name, i) => files.some((file) => file.startsWith(`${packagePaths[i]}/`)));

            const fixes = new Map();
            const addFix = (issueNumber, fixedBy, files) => {
              const fix = fixes.get(issueNumber) ?? { fixedBy: [], packages: new Set() };
              fix.fixedBy.push(fixedBy);
              for (const name of packagesOf(files)) fix.packages.add(name);
              fixes.set(issueNumber, fix);
            };
            let cursor = null;
            let hasNextPage = context.eventName === "pull_request";

            for (const commit of context.payload.commits ?? []) {
              for (const [, issueNumber] of commit.message.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\s+#(\d+)\b/gi)) {
                addFix(Number(issueNumber), commit.id.slice(0, 7), [...commit.added, ...commit.modified, ...commit.removed]);
              }
            }

            const prFiles = hasNextPage
              ? (await github.paginate(github.rest.pulls.listFiles, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                })).flatMap(({ filename, previous_filename }) => [filename, previous_filename].filter(Boolean))
              : [];

            while (hasNextPage) {
              const result = await github.graphql(query, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                number: prNumber,
                cursor,
              });
              const { nodes, pageInfo } = result.repository.pullRequest.closingIssuesReferences;
              for (const node of nodes) {
                if (
                  node.repository.owner.login === context.repo.owner &&
                  node.repository.name === context.repo.repo
                ) {
                  addFix(node.number, `#${prNumber}`, prFiles);
                }
              }
              hasNextPage = pageInfo.hasNextPage;
              cursor = pageInfo.endCursor;
            }

            for (const [issueNumber, { fixedBy, packages }] of fixes) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                });
                if (issue.state !== "open") continue;

                const labels = issue.labels.map(({ name }) => name);

                // Nothing will ever release a fix outside the published packages.
                if (packages.size === 0 && !labels.some((name) => name === label || packageNames.includes(name))) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    body: `Fixed by ${fixedBy.join(", ")}. No package release needed. Closing.`,
                  });
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    state: "closed",
                  });
                  continue;
                }

                for (const name of packages) {
                  try {
                    await github.rest.issues.createLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      name,
                      description: `@time-provider/${name}`,
                    });
                  } catch (error) {
                    if (error.status !== 422) throw error;
                  }
                }

                if (!labels.includes(label)) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    body: `Fixed by ${fixedBy.join(", ")}. This issue will be closed once released.`,
                  });
                }
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: [label, ...packages],
                });
              } catch (error) {
                // Don't let one problematic issue block labelling the rest.
                core.warning(`Failed to label issue #${issueNumber}: ${error.message}`);
              }
            }
