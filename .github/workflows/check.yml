name: Check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: "**"

# A newer push/PR update makes the previous, still-running Check obsolete -
# cancel it rather than let it finish for nothing. github.ref is already
# unique per PR (refs/pull/N/merge) and per branch, so different PRs/branches
# never share a group and always run independently.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branchlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          node-version: "24"
          cache: true
      - run: vp install --frozen-lockfile
      - if: github.event_name == 'push'
        run: vpx validate-branch-name -t ${{ github.ref_name }}

  commitlint:
    # Enforces Conventional Commits
    needs: branchlint
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          node-version: "24"
          cache: true

      - run: vp install --frozen-lockfile

      # Dependabot keeps editing a PR body after the PR is merged, and `edited` re-runs this
      # workflow. By then the head branch is gone, so the base..head range no longer resolves
      # and commitlint dies on a PR that merged cleanly. Only lint a PR that is still open.
      - name: Lint commits (pull request range)
        if: github.event_name == 'pull_request' && github.event.pull_request.state == 'open'
        run: vpx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      # A squash-merge uses the PR title as the final commit message on main - release-please reads that message to classify the change.
      # Lint it too, with the same rules, so a non-conventional title can't slip through and silently drop out of the changelog.
      # GitHub appends " (#<number>)" to that squash header, so lint the exact string it will produce: a title sitting just under
      # commitlint's 100-character header limit passes on its own, then breaks the limit on main once the suffix is added.
      - name: Lint PR title (squash-merge commit message)
        if: github.event_name == 'pull_request' && github.event.pull_request.state == 'open'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_TITLE (#$PR_NUMBER)" | vpx commitlint --verbose

      # Direct pushes bypass PR review entirely.
      # This step re-validates, server-side, whichever commits actually landed by this push
      - name: Lint commits (pushed range)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.forced == false
        run: vpx commitlint --from ${{ github.event.before }} --to ${{ github.sha }} --verbose

      # No reliable prior ref to diff against, either because the branch was just created or because this was a force-push.
      # In both cases, lint the single tip commit instead of skipping validation entirely.
      - name: Lint commit (new branch or force-push, no reliable prior ref)
        if: github.event_name == 'push' && (github.event.before == '0000000000000000000000000000000000000000' || github.event.forced == true)
        run: git log -1 --format=%B ${{ github.sha }} | vpx commitlint --verbose

  dependency-review:
    # Fails a pull request that pulls in a dependency with a known advisory.
    # Deliberately scoped to the diff: the tree already carries advisories in build
    # tooling (vite and esbuild through vite-plus and vitepress, qs through Stryker),
    # none of which reach a published package, so gating on the whole tree would mean
    # a permanently red check or an ignore list to maintain. The audit step below
    # keeps those visible without blocking.
    needs: commitlint
    # Nothing about a PR title edit can change a dependency.
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Audit the whole tree (report only)
        continue-on-error: true
        run: bun audit

      - name: Review dependencies this pull request adds
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  build-test:
    # Ensure project build, tests pass and forward coverage to codecov
    needs: commitlint
    # A pure PR title edit doesn't change any code - no need to rebuild/retest
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          node-version: "24"
          cache: true

      # Each package's `check` script also dry-runs its JSR publish.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - run: vp install --frozen-lockfile
      - run: vp run build
      - run: vp run check

      # The test suites import the build output by path, so they never see the
      # tarball npm would actually publish. Pack it and check it here instead.
      - run: node scripts/verify-packages.ts

      - run: vp test --coverage
      - run: test -f coverage/lcov.info

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test-report.junit.xml

      - name: Extract tests count
        id: extract-tests-count
        run: |
          TESTS_COUNT=$(grep -m1 '<testsuites' test-report.junit.xml | grep -oP 'tests="\K[0-9]+')
          echo "count=$TESTS_COUNT" >> "$GITHUB_OUTPUT"

      - name: Update tests count badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_TESTS_COUNTER_SECRET }}
          gistID: 5c996e614c598efb1231d96c28444493
          filename: time-provider-tests-count-badge.json
          label: tests
          message: ${{ steps.extract-tests-count.outputs.count }}
          color: brightgreen
