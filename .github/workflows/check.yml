name: Check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: "**"

# A newer push/PR update makes the previous, still-running Check obsolete -
# cancel it rather than let it finish for nothing. github.ref is already
# unique per PR (refs/pull/N/merge) and per branch, so different PRs/branches
# never share a group and always run independently.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branchlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: ".node-version"
          cache-toolchain: true
          cache: true
          cache-save: false
      - run: vp install --frozen-lockfile
      - if: github.event_name == 'push'
        run: vpx validate-branch-name -t ${{ github.ref_name }}

  commitlint:
    # Enforces Conventional Commits
    needs: branchlint
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: ".node-version"
          cache-toolchain: true
          cache: true
          cache-save: false

      - run: vp install --frozen-lockfile

      # Dependabot keeps editing a PR body after the PR is merged, and `edited` re-runs this
      # workflow. By then the head branch is gone, so the base..head range no longer resolves
      # and commitlint dies on a PR that merged cleanly. Only lint a PR that is still open.
      - name: Lint commits (pull request range)
        if: github.event_name == 'pull_request' && github.event.pull_request.state == 'open'
        run: vpx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      # A squash-merge uses the PR title as the final commit message on main - release-please reads that message to classify the change.
      # Lint it too, with the same rules, so a non-conventional title can't slip through and silently drop out of the changelog.
      # GitHub appends " (#<number>)" to that squash header, so lint the exact string it will produce: a title sitting just under
      # commitlint's 100-character header limit passes on its own, then breaks the limit on main once the suffix is added.
      - name: Lint PR title (squash-merge commit message)
        if: github.event_name == 'pull_request' && github.event.pull_request.state == 'open'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_TITLE (#$PR_NUMBER)" | vpx commitlint --verbose

      # Direct pushes bypass PR review entirely.
      # This step re-validates, server-side, whichever commits actually landed by this push
      - name: Lint commits (pushed range)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.forced == false
        run: vpx commitlint --from ${{ github.event.before }} --to ${{ github.sha }} --verbose

      # No reliable prior ref to diff against, either because the branch was just created or because this was a force-push.
      # In both cases, lint the single tip commit instead of skipping validation entirely.
      - name: Lint commit (new branch or force-push, no reliable prior ref)
        if: github.event_name == 'push' && (github.event.before == '0000000000000000000000000000000000000000' || github.event.forced == true)
        run: git log -1 --format=%B ${{ github.sha }} | vpx commitlint --verbose

  dependency-review:
    # Fails a pull request that pulls in a dependency with a known advisory.
    # Deliberately scoped to the diff: the tree already carries advisories in build
    # tooling (vite and esbuild through vite-plus and vitepress, qs through Stryker),
    # none of which reach a published package, so gating on the whole tree would mean
    # a permanently red check or an ignore list to maintain. The audit step below
    # keeps those visible without blocking.
    needs: commitlint
    # Nothing about a PR title edit can change a dependency.
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Audit the whole tree (report only)
        continue-on-error: true
        run: bun audit

      - name: Review dependencies this pull request adds
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1

  build-test:
    # Ensure project build, tests pass and forward coverage to codecov
    needs: commitlint
    # A pure PR title edit doesn't change any code - no need to rebuild/retest
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      # A push to a branch with an open PR also runs as pull_request - mutate once, not twice.
      RUN_STRYKER: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # bench:gate builds the newest BENCHMARK.md entry's commit when its cache misses.
          fetch-depth: 0

      # The benchmark gate runs on main pushes, except release merges: they only bump versions,
      # and the commit before them was already gated. Its steps run when release-merge is "false".
      - name: Detect a release merge
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/release-context

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: ".node-version"
          cache-toolchain: true
          cache: true
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # Each package's `check` script also dry-runs its JSR publish.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - run: vp install --frozen-lockfile
      - run: vp run build
      - run: vp run check

      # The test suites import the build output by path, so they never see the
      # tarball npm would actually publish. Pack it and check it here instead.
      - run: vp run verify-packages

      - run: vp test --coverage
      - run: test -f coverage/lcov.info
      - run: vp run fallow --ci

      - name: Extract maximum CRAP score
        id: crap-score
        run: |
          MAX_CRAP=$(node -e "
            const report = require('./reports/crap-report.json');
            if (!Array.isArray(report.methods) || report.methods.length === 0) {
              throw new Error('CRAP report methods array is missing or empty');
            }

            const scores = report.methods.map(method => Number(method.crap));
            if (scores.some(score => !Number.isFinite(score))) {
              throw new Error('Invalid CRAP score in report');
            }

            console.log(Math.max(...scores).toFixed(1));
          ")

          COLOR=$(node -e "
            const score = Number(process.argv[1]);
            console.log(
              score <= 6 ? 'brightgreen' :
              score <= 15 ? 'yellow' :
              score <= 30 ? 'orange' :
              'red'
            );
          " "$MAX_CRAP")

          echo "score=$MAX_CRAP" >> "$GITHUB_OUTPUT"
          echo "color=$COLOR" >> "$GITHUB_OUTPUT"

      - name: Update CRAP score badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_TESTS_COUNTER_SECRET }}
          gistID: 5c996e614c598efb1231d96c28444493
          filename: time-provider-crap-score-badge.json
          label: CRAP score
          message: ${{ steps.crap-score.outputs.score }}
          color: ${{ steps.crap-score.outputs.color }}

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test-report.junit.xml
          report_type: test_results

      - name: Extract tests count
        id: extract-tests-count
        run: |
          TESTS_COUNT=$(grep -m1 '<testsuites' test-report.junit.xml | grep -oP 'tests="\K[0-9]+')
          echo "count=$TESTS_COUNT" >> "$GITHUB_OUTPUT"

      - name: Update tests count badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_TESTS_COUNTER_SECRET }}
          gistID: 5c996e614c598efb1231d96c28444493
          filename: time-provider-tests-count-badge.json
          label: tests
          message: ${{ steps.extract-tests-count.outputs.count }}
          color: brightgreen

      # The gate's baseline is the build of the newest BENCHMARK.md entry's commit, saved on a miss.
      # Its key hashes the files that decide its content, so adding a package rebuilds it.
      - name: Find benchmark baseline
        if: steps.release.outputs.release-merge != 'true'
        id: baseline
        run: echo "sha=$(grep -m1 -oP '^## .*?\(\[\K[0-9a-f]+' BENCHMARK.md)" >> "$GITHUB_OUTPUT"

      - name: Restore benchmark baseline
        if: steps.release.outputs.release-merge != 'true'
        id: baseline-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/time-provider-baseline-${{ steps.baseline.outputs.sha }}
          key: bench-dist-${{ steps.baseline.outputs.sha }}-${{ hashFiles('tools/benchmark/bench/gate.ts', 'tools/benchmark/bench/shared/adapters/kit.ts') }}

      # Fails when a Time-Provider adapter is more than the percentThreshold in tools/benchmark's
      # bench:gate script slower than the same adapter on the baseline, measured on this runner.
      - if: steps.release.outputs.release-merge != 'true'
        run: vp run @time-provider/benchmark#bench:gate

      - name: Save benchmark baseline
        if: ${{ !cancelled() && steps.release.outputs.release-merge != 'true' && steps.baseline-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/time-provider-baseline-${{ steps.baseline.outputs.sha }}
          key: bench-dist-${{ steps.baseline.outputs.sha }}-${{ hashFiles('tools/benchmark/bench/gate.ts', 'tools/benchmark/bench/shared/adapters/kit.ts') }}

      - name: Restore Stryker incremental results
        if: env.RUN_STRYKER == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: stryker-incremental-

      - if: env.RUN_STRYKER == 'true'
        run: vp run stryker

      # Only main writes the incremental cache: a pull_request cache is scoped to its merge ref,
      # so nothing else could read it. Caches are immutable, hence one key per commit.
      - name: Save Stryker incremental results
        if: ${{ !cancelled() && env.RUN_STRYKER == 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}

      - name: Extract mutation score
        id: extract-mutation-score
        if: env.RUN_STRYKER == 'true'
        run: |
          node -e '
            const { files } = JSON.parse(require("fs").readFileSync("reports/mutation/mutation.json", "utf8"));
            const count = {};
            for (const { mutants } of Object.values(files))
              for (const { status } of mutants) count[status] = (count[status] ?? 0) + 1;
            const detected = (count.Killed ?? 0) + (count.Timeout ?? 0);
            const score = (100 * detected) / (detected + (count.Survived ?? 0) + (count.NoCoverage ?? 0));
            console.log(`score=${score.toFixed(2)}`);
            console.log(`color=${score >= 80 ? "brightgreen" : score >= 60 ? "yellow" : "red"}`);
          ' >> "$GITHUB_OUTPUT"

      - name: Update mutation score badge
        if: env.RUN_STRYKER == 'true' && github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_TESTS_COUNTER_SECRET }}
          gistID: 5c996e614c598efb1231d96c28444493
          filename: time-provider-mutation-score-badge.json
          label: mutation score
          message: ${{ steps.extract-mutation-score.outputs.score }}%
          color: ${{ steps.extract-mutation-score.outputs.color }}
