           Q 250.0 466.0 348.0 448.0
           Q 354.0 374.0 289.0 260.0 Q 355.3 105.5 345.0 65.0
           Q 250.0 48.0 155.0 65.0 Z
           M 159.0 69.0 Q 152.8 141.5 250.0 260.0 Q 146.0 374.0 156.0 444.0
           Q 250.0 460.0 344.0 444.0
           Q 354.0 374.0 250.0 260.0 Q 351.3 109.5 341.0 69.0
           Q 250.0 53.0 159.0 69.0 Z" />

  <!-- Rim caps for a 3d, rounded read -->
  <ellipse cx="250" cy="65" rx="95" ry="13" fill="#050607" opacity="0.9" />
  <ellipse cx="250" cy="448" rx="98" ry="13" fill="#14b8a6" opacity="0.85" />

  <!-- Teepee: flat solid, with teal halo -->
  <path fill="#0f766e" stroke="#0f766e" stroke-width="5" stroke-linejoin="round" fill-rule="evenodd"
        d="M 170 430 Q 225 345 250 260 Q 275 345 330 430 Z M 232 430 L 250 385 L 268 430 Z" />
  <path fill="#0f766e" stroke="#0f766e" stroke-width="5" stroke-linejoin="round" d="M 232 90 L 250 135 L 268 90 Z" />
  <path fill="#2B3440" fill-rule="evenodd" d="M 170 430 Q 225 345 250 260 Q 275 345 330 430 Z M 232 430 L 250 385 L 268 430 Z" />
  <path fill="#2B3440" d="M 232 90 L 250 135 L 268 90 Z" />

  <!-- Clock face -->
  <circle fill="none" stroke="#2B3440" stroke-width="1.5" opacity="0.18" cx="250" cy="260" r="34" />
  <line stroke="#2B3440" stroke-width="2" opacity="0.25" x1="250" y1="226" x2="250" y2="232" />
  <line stroke="#2B3440" stroke-width="2" opacity="0.25" x1="284" y1="260" x2="278" y2="260" />
  <line stroke="#2B3440" stroke-width="2" opacity="0.25" x1="250" y1="294" x2="250" y2="288" />
  <line stroke="#2B3440" stroke-width="2" opacity="0.25" x1="216" y1="260" x2="222" y2="260" />

  <!-- Hands: white halo, then real strokes -->
  <line stroke="#ffffff" stroke-width="7" stroke-linecap="round" x1="235" y1="269" x2="250" y2="260" />
  <line stroke="#ffffff" stroke-width="7" stroke-linecap="round" x1="250" y1="260" x2="285" y2="224" />
  <line stroke="#ffffff" stroke-width="5" stroke-linecap="round" x1="263" y1="268" x2="250" y2="260" />
  <line stroke="#ffffff" stroke-width="5" stroke-linecap="round" x1="250" y1="260" x2="210" y2="217" />

  <line stroke="#2B3440" stroke-width="4" stroke-linecap="round" x1="235" y1="269" x2="250" y2="260" />
  <line stroke="#2B3440" stroke-width="4" stroke-linecap="round" x1="250" y1="260" x2="285" y2="224" />
  <line stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" x1="263" y1="268" x2="250" y2="260" />
