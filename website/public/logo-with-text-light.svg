<svg width="530.5" height="483" viewBox="-15.23 48 530.45 483" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hourglassGradientLightText" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#050607" />
      <stop offset="45%" stop-color="#123832" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <style>
      .wordmark { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #2B3440; }
    </style>
  </defs>

  <!-- Ground line -->
  <line x1="90" y1="430" x2="410" y2="430" stroke="#2B3440" stroke-width="4" />

  <!-- Hourglass glass: gradient fill, rounded elliptical top/bottom edges -->
